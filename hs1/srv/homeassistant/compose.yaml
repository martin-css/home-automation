services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: Europe/London
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      # TEMPORARY: patched firebase-messaging 0.4.5 so Ring push events
      # (doorbell/motion) work - see patches/ and SETUP.md. The path is tied to
      # the image's Python version; re-check or remove on every HA update.
      - ./patches/fcmpushclient.py:/usr/local/lib/python3.14/site-packages/firebase_messaging/fcmpushclient.py:ro
